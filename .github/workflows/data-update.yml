name: Data update

# Weekly: refresh the data, let the research agent check for news and fix curated facts;
# when anything changed, the script builds the site and opens a pull request with the
# changes and the agent's report. Nothing reaches the site until that pull request is merged.
on:
  schedule:
    - cron: '23 5 * * 1' # Mondays, 05:23 UTC
  workflow_dispatch:
    inputs:
      agent:
        description: Run the research agent (needs the CLAUDE_CODE_OAUTH_TOKEN secret)
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    # The first run (no cache yet) renders ~3,000 Wowhead quest pages, about an hour.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The research agent is Claude Code, running on your Claude subscription.
      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      # data-raw/ holds the downloads; keeping it between runs means only new quest pages
      # and item tooltips are fetched each week.
      - uses: actions/cache/restore@v4
        with:
          path: data-raw
          key: data-raw-${{ github.run_id }}
          restore-keys: data-raw-

      - name: Refresh data, run the research agent and open a pull request
        run: node scripts/update-agent.mjs ${{ github.event_name == 'workflow_dispatch' && !inputs.agent && '--no-agent' || '' }}
        env:
          # From `claude setup-token` (Pro or Max); runs count against that subscription's limits.
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # Pushes the branch and opens the pull request (needs the permissions above).
          GITHUB_TOKEN: ${{ github.token }}

      - uses: actions/cache/save@v4
        if: always()
        with:
          path: data-raw
          key: data-raw-${{ github.run_id }}
