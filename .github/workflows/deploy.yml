name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Pull requests only build, so a broken change shows up before it's merged.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time; let an in-progress one finish.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'deploy' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run format:check

      - name: Configure Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      # Project sites live under /<repo>/; configure-pages reports the right
      # base path ("" for a custom domain, which becomes "/").
      - name: Build
        run: npm run build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ github.event_name == 'pull_request' && format('/{0}/', github.event.repository.name) || format('{0}/', steps.pages.outputs.base_path) }}

      # The news bell's stories. When Wowhead can't be reached, the deployed copy is kept;
      # with neither, the site deploys without news and the bell stays empty.
      - name: Fetch news
        if: github.event_name != 'pull_request'
        continue-on-error: true
        run: node scripts/fetch-news.mjs dist/news.json --fallback="${SITE_URL%/}/news.json"
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}

      - name: Upload site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
